services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reflection}
      POSTGRES_USER: ${POSTGRES_USER:-reflection}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - "${POSTGRES_DATA_PATH:-/srv/reflection/postgres}:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REFLECTION_API_KEY: ${REFLECTION_API_KEY:?REFLECTION_API_KEY is required}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY is required}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:?VOYAGE_API_KEY is required}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      VOYAGE_BASE_URL: ${VOYAGE_BASE_URL:-https://api.voyageai.com/v1}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-openai/gpt-5.6-luna}
      EXTRACTION_PROVIDER: ${EXTRACTION_PROVIDER:-openai}
      EXTRACTION_REASONING_EFFORT: ${EXTRACTION_REASONING_EFFORT:-medium}
      EXTRACTION_NATIVE_SCHEMA: ${EXTRACTION_NATIVE_SCHEMA:-true}
      RESOLUTION_MODEL: ${RESOLUTION_MODEL:-openai/gpt-5.6-luna}
      RESOLUTION_PROVIDER: ${RESOLUTION_PROVIDER:-openai}
      RESOLUTION_REASONING_EFFORT: ${RESOLUTION_REASONING_EFFORT:-medium}
      RESOLUTION_NATIVE_SCHEMA: ${RESOLUTION_NATIVE_SCHEMA:-true}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-voyage-4-large}
      DATABASE_POOL_MAX_SIZE: ${DATABASE_POOL_MAX_SIZE:-8}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      WORKER_RETRY_BACKOFF_SECONDS: ${WORKER_RETRY_BACKOFF_SECONDS:-2}
      MODEL_CALL_TIMEOUT_SECONDS: ${MODEL_CALL_TIMEOUT_SECONDS:-180}
      MIGRATIONS_DIR: /app/migrations
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 10
